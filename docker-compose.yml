name: rx-transpose

services:
  api:
    build: ./api
    image: rx-transpose-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    image: rx-transpose-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    # 注意：容器内 localhost 优先解析为 ::1，而 nginx 仅监听 IPv4，
    # busybox wget 不会回退到 127.0.0.1，健康检查必须显式使用 127.0.0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：跑完 pytest + Vitest + Playwright 后退出
  # 用法：docker compose --profile verify up --build --exit-code-from verify verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: rx-transpose-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web
      CI: "1"
